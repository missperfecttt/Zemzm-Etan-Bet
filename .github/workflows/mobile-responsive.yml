name: Improve mobile responsiveness

on:
  push:
    branches: [main]

jobs:
  mobile-fix:
    if: github.event.head_commit.message != 'Fix mobile responsiveness'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add responsive CSS
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          marker = '/* MOBILE RESPONSIVE FIX */'
          if marker not in html:
              css = r'''\n        /* MOBILE RESPONSIVE FIX */
        html, body { width: 100%; max-width: 100%; overflow-x: hidden; }
        body { min-width: 0; }
        img, video, iframe, canvas { max-width: 100%; }
        canvas { display: block; }
        button, a { -webkit-tap-highlight-color: transparent; }

        @media (max-width: 767px) {
            .tilt-card:hover { transform: none; box-shadow: none; }
            header > div:first-child { min-width: 0; gap: .5rem; }
            header a.group { min-width: 0; max-width: calc(100vw - 190px); }
            header a.group > div { min-width: 0; }
            header a.group h1 { min-width: 0; font-size: .95rem; line-height: 1.2; white-space: normal; }
            header a.group h1 span:first-child { overflow-wrap: anywhere; }
            header a.group p { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
            header .flex.items-center.space-x-4 { gap: .35rem; margin-left: auto; flex-shrink: 0; }
            header .flex.items-center.space-x-4 > * { margin-left: 0 !important; }
            header .flex.items-center.space-x-4 button { white-space: nowrap; }
            header .flex.items-center.space-x-4 button:first-child { padding-left: .55rem; padding-right: .55rem; }
            main { width: 100%; max-width: 100%; overflow-x: hidden; }
            section { max-width: 100%; overflow-x: hidden; }
            .chart-container { height: 270px; max-height: 300px; }
            #heroCanvas { width: 100% !important; height: 100% !important; }
            #featuredProduct3DCanvas { width: 100% !important; height: 100% !important; }
            .hero, [class*="min-h-[75vh]"] { min-height: auto !important; }
            [class*="text-6xl"] { font-size: 2.25rem !important; line-height: 1.1 !important; }
            [class*="text-5xl"] { font-size: 2rem !important; }
            .space-y-20 > :not([hidden]) ~ :not([hidden]) { margin-top: 3.5rem; }
            .space-y-16 > :not([hidden]) ~ :not([hidden]) { margin-top: 3rem; }
            .space-y-12 > :not([hidden]) ~ :not([hidden]) { margin-top: 2.5rem; }
            table { display: block; width: 100%; overflow-x: auto; white-space: nowrap; }
            input, select, textarea { max-width: 100%; box-sizing: border-box; }
            [role="dialog"], .fixed.inset-0 { max-width: 100vw; }
        }

        @media (max-width: 420px) {
            header > div:first-child { padding-left: .75rem; padding-right: .75rem; }
            header a.group { max-width: calc(100vw - 165px); gap: .4rem; }
            header a.group img { width: 2rem; height: 2rem; }
            header a.group h1 { font-size: .8rem; }
            header a.group h1 span:nth-child(2) { display: none; }
            header a.group p { font-size: .55rem; letter-spacing: .08em; }
            header .flex.items-center.space-x-4 { gap: .25rem; }
            header .flex.items-center.space-x-4 button { font-size: .65rem; padding: .4rem .45rem; }
            [class*="text-4xl"] { font-size: 1.9rem !important; }
            .px-4 { padding-left: .9rem; padding-right: .9rem; }
        }
'''
              if '</style>' not in html:
                  raise SystemExit('No closing style tag found')
              html = html.replace('</style>', css + '    </style>', 1)
              path.write_text(html, encoding='utf-8')

      - name: Commit mobile improvements
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Fix mobile responsiveness'
          git push
