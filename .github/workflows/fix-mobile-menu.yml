name: Stack mobile header controls

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  mobile-header:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stack mobile header controls vertically
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          marker = '</style>'
          css = '''
        /* Mobile header: hamburger on top, cart and language stacked below */
        @media (max-width: 767px) {
          header > .max-w-7xl > .flex > div:last-child {
            display:flex !important;
            flex-direction:column !important;
            align-items:center !important;
            justify-content:center !important;
            gap:5px !important;
            width:44px !important;
            flex:0 0 44px !important;
            margin-left:6px !important;
          }
          #mobileMenuButton {
            order:1 !important;
            width:40px !important;
            height:36px !important;
            min-height:36px !important;
            padding:0 !important;
            border-radius:10px !important;
          }
          #langToggleBtn {
            display:flex !important;
            order:3 !important;
            width:40px !important;
            height:32px !important;
            padding:0 !important;
            align-items:center !important;
            justify-content:center !important;
            border-radius:9px !important;
            font-size:12px !important;
            line-height:1 !important;
          }
          header > .max-w-7xl > .flex > div:last-child > button[onclick*="toggleCartDrawer"] {
            display:flex !important;
            order:2 !important;
            width:40px !important;
            height:32px !important;
            padding:0 !important;
            align-items:center !important;
            justify-content:center !important;
            border-radius:9px !important;
            gap:0 !important;
            font-size:0 !important;
          }
          header > .max-w-7xl > .flex > div:last-child > button[onclick*="toggleCartDrawer"]::before {
            content:'🛒';
            font-size:17px;
            line-height:1;
          }
          header > .max-w-7xl > .flex > div:last-child > button[onclick*="toggleCartDrawer"] #cartBadge {
            position:absolute;
            margin-left:24px;
            margin-top:-20px;
            font-size:9px !important;
          }
          #langToggleBtn #langLabel { font-size:10px !important; }
          #langToggleBtn::before { content:'🌐'; margin-right:3px; font-size:12px; }
          header > .max-w-7xl > .flex > a { padding-right:2px; }
        }
        @media (max-width: 380px) {
          header > .max-w-7xl > .flex > div:last-child { width:40px !important; flex-basis:40px !important; }
          #mobileMenuButton { width:36px !important; }
          #langToggleBtn,
          header > .max-w-7xl > .flex > div:last-child > button[onclick*="toggleCartDrawer"] { width:36px !important; }
        }
'''
          if '/* Mobile header: hamburger on top, cart and language stacked below */' not in s:
              s = s.replace(marker, css + '\n    ' + marker, 1)
          p.write_text(s)
          PY
      - name: Commit stacked mobile controls
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Stack mobile hamburger cart and language controls"
          git push
